# Hosted pipeline: the worker's hourly watch, as a scheduled job against the hosted database.
# Loads only when USDA has published new data (or nothing has loaded for 7 days); the first run backfills from 2017.
# Needs repo secret DATABASE_URL. A failed load fails the job, and GitHub emails you.
name: refresh
on:
  schedule:
    - cron: "17 */4 * * *"  # every 4 hours
  workflow_dispatch:
concurrency: refresh
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m rail refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
