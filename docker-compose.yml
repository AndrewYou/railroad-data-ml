# docker compose up  ->  Postgres, pgAdmin (localhost:5050), Mailpit (localhost:8025) and the pipeline worker.
# Everything is local: no accounts, keys or credentials outside this file.
services:
  db:
    image: postgres:16.15
    environment:
      POSTGRES_USER: rail
      POSTGRES_PASSWORD: rail
      POSTGRES_DB: rail
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/create_test_db.sql:/docker-entrypoint-initdb.d/create_test_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rail"]
      interval: 2s
      retries: 30

  worker:
    build: .
    command: ["python", "-m", "rail", "watch"]  # loads on first start, then whenever USDA publishes
    environment:
      DATABASE_URL: postgresql://rail:rail@db:5432/rail
      TEST_DATABASE_URL: postgresql://rail:rail@db:5432/rail_test
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    depends_on:
      db: {condition: service_healthy}
      mailpit: {condition: service_started}
    restart: unless-stopped

  mailpit:  # catches alert emails; inbox at http://localhost:8025
    image: axllent/mailpit:v1.30
    ports: ["8025:8025"]

  pgadmin:  # http://localhost:5050, server "rail" is preconfigured; password: rail
    image: dpage/pgadmin4:9.17
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports: ["5050:80"]
    volumes: [./pgadmin/servers.json:/pgadmin4/servers.json:ro]
    depends_on: [db]

volumes:
  pgdata:
