# Light and dark themes; viewers switch in the app menu (⋮ -> Settings -> Theme). Charts follow.
[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"  # no Deploy button; the menu keeps Settings -> Theme

[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#1a1a19"
secondaryBackgroundColor = "#2c2c2a"
textColor = "#f0efec"
